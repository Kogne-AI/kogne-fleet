<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/walnut-icon.png" />
    <title>Open Walnut</title>
    <script>
      (function() {
        var t = 'system';
        try { t = localStorage.getItem('open-walnut-theme') || 'system'; } catch(e) {}
        if (t === 'dark') document.documentElement.dataset.theme = 'dark';
        else if (t === 'light') document.documentElement.dataset.theme = 'light';
      })();
      (function() {
        var origFetch = window.fetch;
        window.fetch = function(input, init) {
          try {
            var url = typeof input === 'string' ? input : (input && input.url) ? input.url : '';
            if (url && (url.startsWith('/api/') || url.indexOf('/api/') !== -1)) {
              var token = localStorage.getItem('walnut.deviceToken');
              if (token) {
                init = init ? Object.assign({}, init) : {};
                var h = new Headers(init.headers || {});
                if (!h.has('Authorization')) {
                  h.set('Authorization', 'Bearer ' + token);
                }
                init.headers = h;
              }
            }
          } catch(e) {}
          return origFetch.call(this, input, init);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
